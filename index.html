<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, LabelList } = window.Recharts;

        const TITULOS_RANGOS = {
          vencido: "Vencidos",
          riesgo: "Riesgo Crítico",
          preventiva: "Alerta Preventiva",
          plazo: "Dentro de Plazo"
        };

        const COLORS = {
          vencido: '#dc2626', 
          riesgo: '#f59e0b',  
          preventiva: '#a855f7',
          plazo: '#10b981',   
          otros: '#6366f1'    
        };

        const parseDateStr = (dStr) => {
            if (!dStr || String(dStr) === '-' || String(dStr).trim() === '') return null;
            let str = String(dStr).trim();
            let parts = str.includes('/') ? str.split('/') : str.split('-');
            if (parts.length !== 3) {
                let fallback = new Date(str);
                if (!isNaN(fallback.getTime())) return fallback;
                return null;
            }
            if (parts[0].length === 4) return new Date(parts[0], parts[1]-1, parts[2]); // YYYY-MM-DD
            return new Date(parts[2].length === 2 ? `20${parts[2]}` : parts[2], parts[1]-1, parts[0]); // DD/MM/YYYY
        };

        const formatDateStr = (dStr) => {
            let d = parseDateStr(dStr);
            if (!d) return dStr; 
            return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
        };

        const App = () => {
          const [data, setData] = useState([]);
          const [searchTerm, setSearchTerm] = useState('');
          const [filterEtiqueta, setFilterEtiqueta] = useState('Todos');
          const [filterEstado, setFilterEstado] = useState('Todos');
          const [alertMessage, setAlertMessage] = useState(null);
          
          const [filterDestinatario, setFilterDestinatario] = useState('Todos');
          const [filterRemitente, setFilterRemitente] = useState('Todos');
          const [filterTipo, setFilterTipo] = useState('Todos');
          const [filterTipoPlazo, setFilterTipoPlazo] = useState('Todos');
          const [filterFoco, setFilterFoco] = useState('Todos');

          const showAlert = (msg) => {
              setAlertMessage(msg);
              setTimeout(() => setAlertMessage(null), 5000);
          };

          const [lastUpdated, setLastUpdated] = useState(() => {
            try {
              const metaScript = document.getElementById('dashboard-meta');
              if (metaScript && metaScript.textContent.trim() !== '') {
                const meta = JSON.parse(metaScript.textContent);
                if (meta.lastUpdated) return new Date(meta.lastUpdated);
              }
            } catch (e) {}
            return new Date();
          });

          const [manualCorte, setManualCorte] = useState(() => {
            try {
              const metaScript = document.getElementById('dashboard-meta');
              if (metaScript && metaScript.textContent.trim() !== '') {
                const meta = JSON.parse(metaScript.textContent);
                if (meta.manualCorte) return meta.manualCorte;
              }
            } catch (e) {}
            
            const date = new Date();
            const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
            const horas = date.getHours();
            const minutos = date.getMinutes().toString().padStart(2, '0');
            const ampm = horas >= 12 ? 'P.M.' : 'A.M.';
            return `${date.getDate()} DE ${meses[date.getMonth()]} DEL ${date.getFullYear()} - ${horas.toString().padStart(2, '0')}:${minutos} ${ampm}`;
          });

          const isDeveloper = typeof window.IS_VIEWER === 'undefined' || !window.IS_VIEWER;

          useEffect(() => {
            try {
              const dataScript = document.getElementById('dashboard-data');
              if (dataScript && dataScript.textContent.trim() !== '') {
                const loadedData = JSON.parse(dataScript.textContent);
                
                const processedData = loadedData.map((row, idx) => {
                    let isFijo = row.plazo && row.plazo !== '-' && row.plazo !== '';
                    let fechaEmision = parseDateStr(row.fecha);
                    let fechaPlazo = parseDateStr(row.plazo);
                    let now = new Date();
                    now.setHours(0,0,0,0);

                    let diasTransNum = row.diasTranscurridos !== '' ? parseFloat(row.diasTranscurridos) : 
                                      (fechaEmision ? Math.floor((now - fechaEmision)/(1000*60*60*24)) : 0);

                    let diasEntregaNum = null;
                    if (isFijo) {
                        if (row.diasEntrega !== '' && row.diasEntrega !== '-') {
                            diasEntregaNum = parseFloat(row.diasEntrega);
                        } else if (fechaPlazo) {
                            diasEntregaNum = Math.floor((fechaPlazo - now)/(1000*60*60*24));
                        }
                    }

                    let etiquetaFinal = row.etiqueta;
                    if (!etiquetaFinal || etiquetaFinal === '') {
                        if (isFijo) {
                            if (diasEntregaNum < 0) etiquetaFinal = 'Vencido';
                            else if (diasEntregaNum <= 2) etiquetaFinal = 'Riesgo crítico';
                            else if (diasEntregaNum <= 5) etiquetaFinal = 'Alerta preventiva';
                            else etiquetaFinal = 'Dentro de plazo';
                        } else {
                            if (diasTransNum > 30) etiquetaFinal = 'Vencido';
                            else if (diasTransNum >= 15) etiquetaFinal = 'Riesgo crítico';
                            else if (diasTransNum >= 6) etiquetaFinal = 'Alerta preventiva';
                            else etiquetaFinal = 'Dentro de plazo';
                        }
                    }

                    return {
                        ...row,
                        uid: row.uid || `init-doc-${idx}`,
                        fecha: formatDateStr(row.fecha),
                        plazo: isFijo ? formatDateStr(row.plazo) : '-',
                        diasTranscurridos: isNaN(diasTransNum) ? 0 : diasTransNum,
                        diasEntrega: isNaN(diasEntregaNum) ? null : diasEntregaNum,
                        tipoLazo: isFijo ? 'Fijo' : 'Regular',
                        etiqueta: etiquetaFinal
                    };
                });
                setData(processedData);
              }
            } catch (e) {
                console.error("Error cargando data inicial", e);
            }
          }, []);

          const safeTrim = (val) => {
            return (val !== undefined && val !== null) ? String(val).trim() : '';
          };

          const procesarFilasArray = (rows) => {
            if (!rows || rows.length < 2) {
                showAlert("El archivo no contiene suficientes filas de datos.");
                return;
            }

            let headerRowIndex = 0;
            for (let i = 0; i < Math.min(10, rows.length); i++) {
                if (rows[i] && rows[i].some(cell => {
                    const str = String(cell).toUpperCase();
                    return str.includes('NRO DE EMISI') || str.includes('NRO DOCUMENTO') || str.includes('EXPEDIENTE');
                })) {
                    headerRowIndex = i;
                    break;
                }
            }

            const headers = rows[headerRowIndex].map(h => String(h || '').trim().toUpperCase());
            
            const colIdx = {
              id: headers.findIndex(h => h.includes('NRO DE EMISI')),
              fecha: headers.findIndex(h => h.includes('FECHA EMISI')),
              remitente: headers.findIndex(h => h.includes('REMITENTE')),
              tipo: headers.findIndex(h => h.includes('TIPO DOCUMENTO')),
              nroDoc: headers.findIndex(h => h.includes('NRO DOCUMENTO')),
              destinatario: headers.findIndex(h => h.includes('DESTINA')),
              asunto: headers.findIndex(h => h.includes('ASUNTO')),
              expediente: headers.findIndex(h => h.includes('EXPEDIENTE')),
              estado: headers.findIndex(h => h.includes('ESTADO')),
              comentario: headers.findIndex(h => h.includes('COMENTARIO')),
              plazo: headers.findIndex(h => h === 'PLAZO' || h.includes('FECHA MAX') || h.includes('VENCIMIENTO')),
              diasTranscurridos: headers.findIndex(h => h.includes('DIAS TRANSCURRIDOS') || h === 'DIAS' || h === 'DÍAS'),
              diasEntrega: headers.findIndex(h => h.includes('DIAS PARA ENTREGA')),
              etiqueta: headers.findIndex(h => h.includes('ETIQUETA')),
            };

            let now = new Date();
            now.setHours(0,0,0,0);

            const parseExcelDate = (val) => {
                if (!val) return null;
                if (typeof val === 'number') {
                    const date = new Date(Math.round((val - 25569) * 86400 * 1000));
                    date.setMinutes(date.getMinutes() + date.getTimezoneOffset());
                    return date;
                }
                return parseDateStr(String(val));
            };

            const mappedRows = rows.slice(headerRowIndex + 1).map((r, rowIndex) => {
              while(r.length < headers.length) r.push('');
              
              const idVal = colIdx.id > -1 ? r[colIdx.id] : r[0];
              if (!idVal || String(idVal).trim() === '') return null;
              
              const rawDiasTrans = colIdx.diasTranscurridos > -1 ? r[colIdx.diasTranscurridos] : '';
              const rawDiasEntrega = colIdx.diasEntrega > -1 ? r[colIdx.diasEntrega] : '';
              const rawEtiqueta = colIdx.etiqueta > -1 ? r[colIdx.etiqueta] : '';
              const rawPlazo = colIdx.plazo > -1 ? r[colIdx.plazo] : '';
              const rawFecha = colIdx.fecha > -1 ? r[colIdx.fecha] : r[1];
              
              let fechaEmision = parseExcelDate(rawFecha);
              let fechaPlazo = parseExcelDate(rawPlazo);
              
              const fechaEmisionStr = fechaEmision ? `${fechaEmision.getDate().toString().padStart(2,'0')}/${(fechaEmision.getMonth()+1).toString().padStart(2,'0')}/${fechaEmision.getFullYear()}` : String(rawFecha || '');

              let plazoStr = '-';
              let isFijo = false;
              if (rawPlazo && String(rawPlazo).trim() !== '' && String(rawPlazo).trim() !== '-') {
                  isFijo = true;
                  if (fechaPlazo) {
                      plazoStr = `${fechaPlazo.getDate().toString().padStart(2,'0')}/${(fechaPlazo.getMonth()+1).toString().padStart(2,'0')}/${fechaPlazo.getFullYear()}`;
                  } else {
                      plazoStr = String(rawPlazo);
                  }
              }
              
              let diasTransNum = 0;
              if (rawDiasTrans !== '') {
                  diasTransNum = parseFloat(rawDiasTrans);
              } else if (fechaEmision) {
                  diasTransNum = Math.floor((now - fechaEmision)/(1000*60*60*24));
              }

              let diasEntregaNum = null;
              if (isFijo) {
                  if (rawDiasEntrega !== '' && rawDiasEntrega !== '-') {
                      diasEntregaNum = parseFloat(rawDiasEntrega);
                  } else if (fechaPlazo) {
                      diasEntregaNum = Math.floor((fechaPlazo - now)/(1000*60*60*24));
                  }
              }

              let etiquetaFinal = String(rawEtiqueta).trim();
              if (!etiquetaFinal || etiquetaFinal === '') {
                  if (isFijo) {
                      if (diasEntregaNum < 0) etiquetaFinal = 'Vencido';
                      else if (diasEntregaNum <= 2) etiquetaFinal = 'Riesgo crítico';
                      else if (diasEntregaNum <= 5) etiquetaFinal = 'Alerta preventiva';
                      else etiquetaFinal = 'Dentro de plazo';
                  } else {
                      if (diasTransNum > 30) etiquetaFinal = 'Vencido';
                      else if (diasTransNum >= 15) etiquetaFinal = 'Riesgo crítico';
                      else if (diasTransNum >= 6) etiquetaFinal = 'Alerta preventiva';
                      else etiquetaFinal = 'Dentro de plazo';
                  }
              }

              return {
                uid: `doc-${rowIndex}-${Date.now()}`,
                id: safeTrim(idVal),
                fecha: fechaEmisionStr,
                remitente: safeTrim(colIdx.remitente > -1 ? r[colIdx.remitente] : r[2]),
                tipo: safeTrim(colIdx.tipo > -1 ? r[colIdx.tipo] : r[3]),
                nroDoc: safeTrim(colIdx.nroDoc > -1 ? r[colIdx.nroDoc] : r[4]),
                destinatario: safeTrim(colIdx.destinatario > -1 ? r[colIdx.destinatario] : r[5]),
                asunto: safeTrim(colIdx.asunto > -1 ? r[colIdx.asunto] : r[6]).replace(/\n/g, ' ').replace(/\r/g, ''),
                expediente: safeTrim(colIdx.expediente > -1 ? r[colIdx.expediente] : r[7]),
                estado: safeTrim(colIdx.estado > -1 ? r[colIdx.estado] : r[8]),
                comentario: safeTrim(colIdx.comentario > -1 ? r[colIdx.comentario] : ''),
                plazo: plazoStr,
                diasTranscurridos: isNaN(diasTransNum) ? 0 : diasTransNum,
                diasEntrega: isNaN(diasEntregaNum) ? null : diasEntregaNum,
                tipoLazo: isFijo ? 'Fijo' : 'Regular',
                etiqueta: etiquetaFinal
              };
            }).filter(Boolean);

            if (mappedRows.length > 0) {
              setData(mappedRows);
              const updateTime = new Date();
              setLastUpdated(updateTime); 
              const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
              const horas = updateTime.getHours();
              const minutos = updateTime.getMinutes().toString().padStart(2, '0');
              const ampm = horas >= 12 ? 'P.M.' : 'A.M.';
              setManualCorte(`${updateTime.getDate()} DE ${meses[updateTime.getMonth()]} DEL ${updateTime.getFullYear()} - ${horas.toString().padStart(2, '0')}:${minutos} ${ampm}`);
            } else {
              showAlert("No se encontraron datos válidos en el archivo. Revisa que las columnas coincidan.");
            }
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            
            reader.onload = (event) => {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = window.XLSX.read(data, {type: 'array'});
                    
                    let targetSheetName = workbook.SheetNames[0];
                    for (let name of workbook.SheetNames) {
                        const preview = window.XLSX.utils.sheet_to_json(workbook.Sheets[name], {header: 1});
                        if (preview.length > 0 && preview.some(row => row && row.some && row.some(c => String(c).toUpperCase().includes('EXPEDIENTE') || String(c).toUpperCase().includes('NRO DE EMISI') || String(c).toUpperCase().includes('NRO DOCUMENTO')))) {
                            targetSheetName = name;
                            break;
                        }
                    }
                    
                    const worksheet = workbook.Sheets[targetSheetName];
                    const rows = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    procesarFilasArray(rows);
                } catch (error) {
                    console.error("Error al leer Excel/CSV:", error);
                    showAlert("Error al leer el archivo. Verifica que sea un Excel o CSV válido.");
                }
            };
            
            reader.readAsArrayBuffer(file);
          };

          const exportarDashboard = () => {
            const exportDate = new Date();
            const dataString = JSON.stringify(data);
            const documentClone = document.cloneNode(true);
            
            const dataScript = documentClone.getElementById('dashboard-data');
            if(dataScript) dataScript.textContent = dataString;

            let metaScript = documentClone.getElementById('dashboard-meta');
            if(metaScript) metaScript.textContent = JSON.stringify({ 
                lastUpdated: exportDate.toISOString(),
                manualCorte: manualCorte 
            });

            const viewerScript = documentClone.createElement('script');
            viewerScript.textContent = 'window.IS_VIEWER = true;';
            documentClone.head.appendChild(viewerScript);

            const rootDiv = documentClone.getElementById('root');
            if(rootDiv) rootDiv.innerHTML = '';

            const htmlContent = "<!DOCTYPE html>\n" + documentClone.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Dashboard_Publico_OPPMI.html';
            a.click();
            setLastUpdated(exportDate);
          };

          const checkFilters = (item, skipField) => {
            const searchStr = searchTerm.toLowerCase();
            const matchesSearch = (item.id || '').toLowerCase().includes(searchStr) || (item.asunto || '').toLowerCase().includes(searchStr);
            const mEtiqueta = skipField === 'etiqueta' || filterEtiqueta === 'Todos' || item.etiqueta === filterEtiqueta;
            const mEstado = skipField === 'estado' || filterEstado === 'Todos' || (item.estado || '').toUpperCase() === filterEstado;
            const mDestinatario = skipField === 'destinatario' || filterDestinatario === 'Todos' || (item.destinatario || '').trim() === filterDestinatario;
            const mRemitente = skipField === 'remitente' || filterRemitente === 'Todos' || getRemProcessed(item.remitente) === filterRemitente;
            const mTipo = skipField === 'tipo' || filterTipo === 'Todos' || (item.tipo || '').trim() === filterTipo;
            const mTipoPlazo = skipField === 'tipoPlazo' || filterTipoPlazo === 'Todos' || (filterTipoPlazo === 'Fijo' && item.tipoLazo === 'Fijo') || (filterTipoPlazo === 'Regular' && item.tipoLazo === 'Regular');
            return matchesSearch && mEtiqueta && mEstado && mDestinatario && mRemitente && mTipo && mTipoPlazo;
          };

          const filteredData = data.filter(item => checkFilters(item, 'none'));

          const stats = useMemo(() => ({
            total: filteredData.length,
            vencidos: filteredData.filter(d => (d.etiqueta || '').toLowerCase().includes('vencido')).length,
            riesgo: filteredData.filter(d => (d.etiqueta || '').toLowerCase().includes('riesgo')).length,
            preventiva: filteredData.filter(d => (d.etiqueta || '').toLowerCase().includes('preventiva')).length,
            enPlazo: filteredData.filter(d => (d.etiqueta || '').toLowerCase().includes('plazo')).length,
          }), [filteredData]);

          const getPercentage = (val, tot) => tot === 0 ? '0%' : Math.round((val / tot) * 100) + '%';

          const chartData = useMemo(() => {
            const counts = {};
            filteredData.forEach(d => {
              const key = d.etiqueta || 'Otros';
              counts[key] = (counts[key] || 0) + 1;
            });
            return Object.keys(counts).map(key => ({ name: key, value: counts[key] }));
          }, [filteredData]);

          const focoCriticoData = useMemo(() => {
            return filteredData
              .filter(d => {
                const tag = (d.etiqueta || '').toLowerCase();
                return tag.includes('vencido') || tag.includes('riesgo');
              })
              .sort((a, b) => {
                const aVencido = (a.etiqueta || '').toLowerCase().includes('vencido') ? -1 : 1;
                const bVencido = (b.etiqueta || '').toLowerCase().includes('vencido') ? -1 : 1;
                if (aVencido !== bVencido) return aVencido - bVencido;
                
                const valA = a.tipoLazo === 'Fijo' ? a.diasEntrega : -a.diasTranscurridos;
                const valB = b.tipoLazo === 'Fijo' ? b.diasEntrega : -b.diasTranscurridos;
                return valA - valB;
              });
          }, [filteredData]);

          const focoCriticoStats = useMemo(() => ({
            total: focoCriticoData.length,
            vencidos: focoCriticoData.filter(d => (d.etiqueta || '').toLowerCase().includes('vencido')).length,
            riesgo: focoCriticoData.filter(d => (d.etiqueta || '').toLowerCase().includes('riesgo')).length,
          }), [focoCriticoData]);

          const focoCriticoTarjetas = useMemo(() => {
            return focoCriticoData.filter(d => {
              if (filterFoco === 'Todos') return true;
              if (filterFoco === 'Vencido' && (d.etiqueta || '').toLowerCase().includes('vencido')) return true;
              if (filterFoco === 'Riesgo crítico' && (d.etiqueta || '').toLowerCase().includes('riesgo')) return true;
              return false;
            });
          }, [focoCriticoData, filterFoco]);

          const barData = useMemo(() => {
            const destCounts = {};
            filteredData.forEach(function(d) {
              const parts = (d.destinatario || '').trim().split(/\s+/) || [];
              let shortName = d.destinatario || "Sin Asignar";
              if (parts.length >= 3) {
                shortName = `${parts[2]} ${parts[0]}`; 
              } else if (parts.length === 2) {
                shortName = `${parts[1]} ${parts[0]}`; 
              }
              destCounts[shortName] = (destCounts[shortName] || 0) + 1;
            });
            return Object.keys(destCounts)
              .map(function(name) { return { name: name, documentos: destCounts[name] }; })
              .sort(function(a, b) { return b.documentos - a.documentos; });
          }, [filteredData]);

          const getRemProcessed = (remRaw) => {
            if (!remRaw) return '';
            return remRaw.includes('-') ? remRaw.split('-').slice(1).join('-').trim() : remRaw.trim();
          };

          const listDestinatarios = useMemo(() => {
            const set = new Set();
            data.forEach(item => { if (checkFilters(item, 'destinatario') && item.destinatario) set.add(item.destinatario.trim()); });
            return Array.from(set).sort();
          }, [data, searchTerm, filterEtiqueta, filterEstado, filterRemitente, filterTipo, filterTipoPlazo]);

          const listRemitentes = useMemo(() => {
            const set = new Set();
            data.forEach(item => { if (checkFilters(item, 'remitente') && item.remitente) set.add(getRemProcessed(item.remitente)); });
            return Array.from(set).sort();
          }, [data, searchTerm, filterEtiqueta, filterEstado, filterDestinatario, filterTipo, filterTipoPlazo]);

          const listTipos = useMemo(() => {
            const set = new Set();
            data.forEach(item => { if (checkFilters(item, 'tipo') && item.tipo) set.add(item.tipo.trim()); });
            return Array.from(set).sort();
          }, [data, searchTerm, filterEtiqueta, filterEstado, filterDestinatario, filterRemitente, filterTipoPlazo]);

          const listEstados = useMemo(() => {
            const set = new Set();
            data.forEach(item => { if (checkFilters(item, 'estado') && item.estado) set.add(item.estado.toUpperCase()); });
            return Array.from(set).sort();
          }, [data, searchTerm, filterEtiqueta, filterDestinatario, filterRemitente, filterTipo, filterTipoPlazo]);

          const listTipoPlazos = useMemo(() => {
            const set = new Set();
            data.forEach(item => { if (checkFilters(item, 'tipoPlazo') && item.tipoLazo) set.add(item.tipoLazo); });
            return Array.from(set).sort();
          }, [data, searchTerm, filterEtiqueta, filterEstado, filterDestinatario, filterRemitente, filterTipo]);

          const listEtiquetas = useMemo(() => {
            const set = new Set();
            data.forEach(item => { if (checkFilters(item, 'etiqueta') && item.etiqueta) set.add(item.etiqueta); });
            return Array.from(set).sort();
          }, [data, searchTerm, filterEstado, filterDestinatario, filterRemitente, filterTipo, filterTipoPlazo]);

          return (
            <div className="min-h-screen bg-[#f8fafc] p-4 md:p-8 font-sans text-slate-900 relative">
              
              {alertMessage && (
                  <div className="fixed top-10 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 animate-bounce font-bold flex items-center gap-3">
                      <i className="fa-solid fa-triangle-exclamation text-xl"></i>
                      {alertMessage}
                  </div>
              )}

              <header className="bg-gradient-to-r from-blue-50 via-indigo-50 to-indigo-100 rounded-[2rem] p-6 md:p-8 shadow-lg shadow-indigo-200/50 border border-indigo-200 mb-10 relative overflow-hidden flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 z-20">
                
                <div className="absolute right-0 bottom-0 w-[80%] md:w-[60%] xl:w-[50%] h-[120%] pointer-events-none z-0 opacity-70 mix-blend-multiply flex justify-end items-end overflow-hidden" 
                     style={{ maskImage: 'linear-gradient(to right, transparent 0%, black 50%)', WebkitMaskImage: 'linear-gradient(to right, transparent 0%, black 50%)' }}>
                    <img src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1000&auto=format&fit=crop" alt="Bosque" className="h-full w-full object-cover object-bottom" onError={(e) => e.target.style.display = 'none'} />
                </div>

                <div className="flex flex-col sm:flex-row items-start sm:items-center gap-6 relative z-10 w-full xl:w-auto">
                  <div className="bg-white p-2.5 rounded-2xl shadow-sm border border-white shrink-0">
                      <img src="MINAM LOGO.jpg" alt="MINAM" className="h-12 sm:h-14 object-contain" 
                           onError={(e) => { e.target.style.display = 'none'; e.target.parentNode.innerHTML = '<span class="text-2xl font-black text-indigo-900 tracking-tighter px-2">MINAM</span>'; }} />
                  </div>
                  
                  <div className="hidden sm:block h-16 w-0.5 bg-indigo-200 rounded-full"></div>
                  
                  <div className="flex-1 w-full">
                    <h1 className="text-2xl sm:text-3xl font-black text-indigo-950 tracking-tight">SEGUIMIENTO DOCUMENTAL - OPPMI</h1>
                    
                    <div className="flex flex-wrap items-center gap-3 mt-3">
                      <div className={`flex items-center gap-2 p-1.5 rounded-xl border w-full sm:w-auto transition-colors ${isDeveloper ? 'bg-white/70 border-indigo-300 focus-within:bg-white focus-within:border-indigo-400 shadow-sm' : 'bg-transparent border-transparent'}`}>
                        <span className="text-[10px] font-black text-indigo-800 bg-indigo-200/80 px-2 py-1 rounded uppercase tracking-wider shrink-0">
                          CORTE:
                        </span>
                        {isDeveloper ? (
                          <>
                            <input 
                              type="text" 
                              className="text-xs sm:text-sm font-bold text-indigo-900 bg-transparent border-none focus:ring-0 focus:outline-none w-full sm:w-[260px] placeholder:text-indigo-400/70"
                              value={manualCorte}
                              onChange={(e) => setManualCorte(e.target.value)}
                              placeholder="Ej. 17 de abril del 2026 - 12:00 P.M."
                            />
                            <i className="fa-solid fa-pen text-indigo-400 text-[10px] mr-2" title="Puedes editar este texto"></i>
                          </>
                        ) : (
                          <span className="text-xs sm:text-sm font-bold text-indigo-900 px-1 w-full sm:w-[260px]">
                            {manualCorte}
                          </span>
                        )}
                      </div>
                      
                      <div className="flex items-center gap-2 text-[11px] font-bold text-indigo-700 bg-white/60 px-3 py-2 rounded-xl border border-indigo-100 shadow-sm shrink-0">
                        <i className="fa-solid fa-database text-indigo-500"></i> {filteredData.length} tareas / docs
                      </div>
                    </div>
                  </div>
                </div>
                
                {isDeveloper && (
                  <div className="flex flex-col sm:flex-row gap-4 w-full xl:w-auto relative z-10">
                      <label className="flex-1 flex items-center gap-4 bg-white/90 backdrop-blur-md px-6 py-4 border-2 border-dashed border-indigo-300 rounded-[2rem] cursor-pointer hover:border-indigo-500 hover:bg-white transition-all shadow-sm group">
                        <i className="fa-solid fa-file-excel text-indigo-400 text-2xl group-hover:text-indigo-600 transition-all"></i>
                        <div className="text-left"><span className="block text-sm font-black text-indigo-950">1. Cargar Datos</span><span className="block text-[10px] text-indigo-500 font-bold uppercase">CSV o Excel (.xlsx)</span></div>
                        <input type="file" className="hidden" accept=".csv, .xlsx, .xls" onChange={handleFileUpload} onClick={(e) => e.target.value = null} />
                      </label>
                      <button onClick={exportarDashboard} className="flex-1 flex items-center gap-4 bg-indigo-600 backdrop-blur-md px-6 py-4 border-2 border-indigo-600 rounded-[2rem] hover:bg-indigo-700 hover:scale-105 transition-all shadow-lg shadow-indigo-300 group">
                        <i className="fa-solid fa-download text-white text-2xl group-hover:-translate-y-1 transition-transform"></i>
                        <div className="text-left"><span className="block text-sm font-black text-white">2. Exportar Archivo</span><span className="block text-[10px] text-indigo-200 font-bold uppercase">Descargar para Compartir</span></div>
                      </button>
                  </div>
                )}
              </header>

              <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-4">
                <StatCard title="Total Pendientes" value={stats.total} percentage="100%" iconClass="fa-solid fa-file-lines" color="text-indigo-600" bg="bg-indigo-50" />
                <StatCard title={TITULOS_RANGOS.vencido} value={stats.vencidos} percentage={getPercentage(stats.vencidos, stats.total)} iconClass="fa-solid fa-triangle-exclamation" color="text-red-700" bg="bg-red-100" />
                <StatCard title={TITULOS_RANGOS.riesgo} value={stats.riesgo} percentage={getPercentage(stats.riesgo, stats.total)} iconClass="fa-solid fa-clock" color="text-amber-600" bg="bg-amber-50" />
                <StatCard title={TITULOS_RANGOS.preventiva} value={stats.preventiva} percentage={getPercentage(stats.preventiva, stats.total)} iconClass="fa-solid fa-bell" color="text-purple-600" bg="bg-purple-50" />
                <StatCard title={TITULOS_RANGOS.plazo} value={stats.enPlazo} percentage={getPercentage(stats.enPlazo, stats.total)} iconClass="fa-solid fa-circle-check" color="text-emerald-600" bg="bg-emerald-50" />
              </div>

              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-10 flex flex-col xl:flex-row items-center justify-center gap-4 xl:gap-8">
                  <div className="flex items-center gap-2 text-slate-500 font-black text-[10px] uppercase tracking-widest shrink-0">
                      <i className="fa-solid fa-circle-info text-indigo-400 text-lg"></i>
                      Criterios de Alerta
                  </div>
                  <div className="flex flex-col md:flex-row flex-wrap items-center justify-center gap-4 text-[10px] font-bold text-slate-600 w-full xl:w-auto">
                      <div className="flex flex-wrap items-center justify-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border border-slate-100 w-full md:w-auto">
                          <span className="bg-slate-200 text-slate-600 px-2 py-1 rounded uppercase tracking-wider font-black text-[9px] mr-1">Trámite Regular:</span>
                          <span className="flex items-center gap-1.5 whitespace-nowrap"><div className="w-2 h-2 rounded-full bg-emerald-500 shadow-sm"></div> 0 a 5 días</span>
                          <span className="flex items-center gap-1.5 whitespace-nowrap"><div className="w-2 h-2 rounded-full bg-purple-500 shadow-sm"></div> 6 a 14 días</span>
                          <span className="flex items-center gap-1.5 whitespace-nowrap"><div className="w-2 h-2 rounded-full bg-amber-500 shadow-sm"></div> 15 a 29 días</span>

                                    Vencidos
                                  </span>
                                  <span className="text-red-200/80 text-[9px] font-black uppercase tracking-widest mt-1 ml-1 bg-red-500/20 w-fit px-1.5 py-0.5 rounded border border-red-400/30">Plazo Excedido</span>
                              </div>
                              <span className="text-white font-black text-4xl leading-none drop-shadow-[0_0_15px_rgba(239,68,68,0.9)]">{focoCriticoStats.vencidos}</span>
                          </div>
                          
                          <div className="flex items-end justify-between border-b border-indigo-400/30 pb-3 mb-2 gap-2">
                              <div className="flex flex-col">
                                  <span className="text-amber-400 font-black text-lg whitespace-nowrap tracking-wider flex items-center gap-2 drop-shadow-[0_0_10px_rgba(245,158,11,0.8)]">
                                    <i className="fa-solid fa-clock text-xl animate-pulse text-amber-400 drop-shadow-md"></i>
                                    RIESGO CRÍTICO

                              <span className="text-white font-black text-4xl leading-none drop-shadow-[0_0_15px_rgba(245,158,11,0.9)]">{focoCriticoStats.riesgo}</span>

                      </div>

                            <div className="flex gap-1.5">
                               <button onClick={() => setFilterFoco('Todos')} className={`flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${filterFoco === 'Todos' ? 'bg-white text-indigo-700 shadow-md scale-[1.02]' : 'bg-white/10 text-indigo-100 hover:bg-white/20'}`}>Mostrar Ambos</button>
                               <button onClick={() => setFilterFoco('Vencido')} className={`flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${filterFoco === 'Vencido' ? 'bg-red-500 text-white shadow-[0_0_10px_rgba(239,68,68,0.5)] scale-[1.02]' : 'bg-white/10 text-indigo-100 hover:bg-white/20'}`}>Solo Vencidos</button>
                            </div>
                            <button onClick={() => setFilterFoco('Riesgo crítico')} className={`w-full py-2 rounded-xl text-[9px] font-black uppercase transition-all ${filterFoco === 'Riesgo crítico' ? 'bg-amber-500 text-white shadow-[0_0_10px_rgba(245,158,11,0.5)] scale-[1.02]' : 'bg-white/10 text-indigo-100 hover:bg-white/20'}`}>Solo Riesgos</button>
                        </div>
                      </div>
                  </div>

                  <div className="p-6 lg:p-8 flex-1 min-w-0 bg-white/5 relative z-10 flex flex-col">
                      <div className="grid grid-rows-2 grid-flow-col gap-5 overflow-x-auto pb-6 snap-x foco-scrollbar auto-cols-max flex-1">

                                 <i className="fa-solid fa-check-circle text-5xl text-indigo-200 mb-4"></i>
                                 <p className="text-indigo-100 font-black text-lg">No hay alertas activas</p>
                                 <p className="text-indigo-200 text-xs">para el filtro seleccionado.</p>
                             </div>
                          ) : focoCriticoTarjetas.map(doc => {
                              const isFijo = doc.tipoLazo === 'Fijo';
                              const isAlert = (doc.etiqueta || '').toLowerCase().includes('vencido') || (doc.etiqueta || '').toLowerCase().includes('riesgo');
                              
                              return (
                              <div key={doc.uid} className="bg-white rounded-[1.5rem] p-5 w-[310px] h-[250px] shadow-lg flex flex-col justify-between border-b-[6px] shrink-0 snap-center hover:-translate-y-1 transition-transform" 
                                   style={{ borderBottomColor: (doc.etiqueta||'').toLowerCase().includes('vencido') ? COLORS.vencido : (doc.etiqueta||'').toLowerCase().includes('riesgo') ? COLORS.riesgo : COLORS.plazo }}>
                                  <div className="flex flex-col flex-grow min-h-0">
                                    <div className="flex justify-between items-start mb-2.5 shrink-0">
                                        <div className="flex items-center gap-2">
                                            <span className="text-[10px] font-black text-slate-500 bg-slate-100 px-2 py-1 rounded-md uppercase tracking-wider">{doc.id}</span>
                                            <span className={`text-[9px] font-black px-2 py-1 rounded-md uppercase tracking-wider ${isFijo ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-200 text-slate-600'}`}>
                                                {isFijo ? 'Plazo Fijo' : 'Regular'}
                                            </span>
                                        </div>
                                        {isAlert && (
                                            <i className="fa-solid fa-circle-exclamation text-red-500 animate-pulse text-lg ml-2"></i>
                                        )}
                                    </div>
                                    <div className="text-xs font-black text-slate-800 line-clamp-2 leading-tight mb-2 shrink-0" title={doc.destinatario}>{doc.destinatario}</div>
                                    <div className="text-[10px] text-slate-600 font-medium line-clamp-4 leading-relaxed bg-slate-50 p-3 rounded-xl italic overflow-y-auto no-scrollbar flex-grow">"{doc.asunto}"</div>
                                  </div>
                                  <div className="flex items-end justify-between pt-3 mt-3 border-t border-slate-100 shrink-0">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-black uppercase tracking-wider text-red-600">{isFijo ? (doc.diasEntrega < 0 ? 'Venció el' : 'Vence el') : 'Antigüedad'}</span>
                                        <span className="text-sm font-black text-slate-800">{isFijo ? doc.plazo : `${doc.diasTranscurridos} días`}</span>
                                    </div>
                                    <div className="flex flex-col items-end">
                                      <div className="text-3xl font-black leading-none flex items-baseline gap-1 text-red-600">
                                          {isFijo ? Math.abs(doc.diasEntrega) : doc.diasTranscurridos}<span className="text-xs font-bold text-slate-400 mb-1">d</span>
                                      </div>
                                      <span className="text-[9px] font-bold text-slate-400 uppercase mt-1">{isFijo ? (doc.diasEntrega < 0 ? 'Vencido' : 'Restantes') : 'Transcurridos'}</span>
                                    </div>
                                  </div>
                              </div>
                              );
                          })}
                      </div>
                  </div>
                </div>
              )}

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
                <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border border-white flex flex-col h-[480px]">
                  <h2 className="text-xl font-black mb-8 flex items-center gap-3 text-slate-800">
                    <i className="fa-solid fa-filter text-indigo-500"></i> Estado de Alerta
                  </h2>
                  <div className="flex-1 w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <PieChart>
                        <Pie data={chartData} cx="50%" cy="50%" innerRadius={55} outerRadius={85} paddingAngle={8} dataKey="value" 
                             label={({ name, value }) => `${name}: ${value}`} labelLine={{ stroke: '#cbd5e1', strokeWidth: 1 }} fontSize={11} fontWeight={700}>
                          {chartData.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={entry.name.toLowerCase().includes('vencido') ? COLORS.vencido : entry.name.toLowerCase().includes('riesgo') ? COLORS.riesgo : entry.name.toLowerCase().includes('preventiva') ? COLORS.preventiva : COLORS.plazo} strokeWidth={0} />
                          ))}
                        </Pie>
                        <Tooltip contentStyle={{ borderRadius: '20px', border: 'none', boxShadow: '0 15px 35px rgba(0,0,0,0.1)' }} />
                        <Legend verticalAlign="bottom" iconType="circle" wrapperStyle={{ paddingTop: '20px' }}/>
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="lg:col-span-2 bg-white p-8 rounded-[2.5rem] shadow-xl border border-white h-[480px] flex flex-col">
                  <h2 className="text-xl font-black mb-8 flex items-center gap-3 text-slate-800 shrink-0">
                    <i className="fa-solid fa-user text-blue-500"></i> Carga Actual por Especialista
                  </h2>
                  <div className="flex-1 w-full overflow-y-auto pr-4">
                    <div style={{ height: Math.max(350, barData.length * 45) + 'px', width: '100%' }}>
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={barData} layout="vertical" margin={{ left: 40, right: 50 }}>
                          <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#f1f5f9" />
                          <XAxis type="number" hide />
                          <YAxis dataKey="name" type="category" width={150} fontSize={11} tickLine={false} axisLine={false} fontStyle="bold" />
                          <Tooltip cursor={{fill: '#f8fafc', radius: 12}} />
                          <Bar dataKey="documentos" fill="#6366f1" radius={[0, 12, 12, 0]} barSize={28}>
                            <LabelList dataKey="documentos" position="right" fill="#475569" fontSize={13} fontWeight="bold" />
                          </Bar>
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-[2.5rem] shadow-xl border border-white overflow-hidden">
                <div className="p-8 border-b border-slate-50 flex flex-col md:flex-row gap-6 justify-between items-center bg-white/50 backdrop-blur-sm">
                  <div className="relative w-full md:w-[500px]">
                    <i className="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" placeholder={`Buscar en las ${data.length} filas del excel (ID, Asunto)...`} className="w-full pl-12 pr-6 py-4 bg-slate-50 border-0 rounded-2xl focus:outline-none font-bold text-sm" 
                           value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                  </div>
                  <div className="flex items-center gap-2 overflow-x-auto w-full md:w-auto no-scrollbar">
                    {['Todos', 'Vencido', 'Riesgo crítico', 'Alerta preventiva', 'Dentro de plazo'].map(tag => (
                      <button key={tag} onClick={() => setFilterEtiqueta(tag)} className={`px-6 py-3 rounded-2xl text-[10px] font-black whitespace-nowrap transition-all duration-500 ${filterEtiqueta === tag ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-200 scale-105' : 'bg-slate-100 text-slate-400 hover:bg-slate-200 hover:text-slate-600'}`}>{tag.toUpperCase()}</button>
                    ))}
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-50/30 border-b border-slate-100">

                        <th className="p-6 align-top">
                          <div className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Referencia</div>
                          <div className="flex items-center gap-2">
                            <span className="text-[9px] font-bold text-slate-400 w-10">TIPO:</span>
                            <select className="bg-white border border-slate-200 rounded-lg text-indigo-600 font-bold text-[9px] uppercase p-1 cursor-pointer outline-none hover:bg-slate-50 shadow-sm w-[120px]" value={filterTipo} onChange={(e) => setFilterTipo(e.target.value)}>
                              <option value="Todos">-- TODOS --</option>
                              {listTipos.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                          </div>
                        </th>
                        <th className="p-6 align-top">
                          <div className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Destinatario & Gestión</div>
                          <div className="flex flex-col gap-2">
                            <div className="flex items-center gap-2">
                              <span className="text-[9px] font-bold text-slate-400 w-20">DESTINATARIO:</span>
                              <select className="bg-white border border-slate-200 rounded-lg text-indigo-600 font-bold text-[9px] uppercase p-1 cursor-pointer outline-none hover:bg-slate-50 shadow-sm w-[200px]" value={filterDestinatario} onChange={(e) => setFilterDestinatario(e.target.value)}>
                                <option value="Todos">-- TODOS --</option>
                                {listDestinatarios.map(d => <option key={d} value={d}>{d}</option>)}
                              </select>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className="text-[9px] font-bold text-slate-400 w-20">REMITENTE:</span>
                              <select className="bg-white border border-slate-200 rounded-lg text-indigo-600 font-bold text-[9px] uppercase p-1 cursor-pointer outline-none hover:bg-slate-50 shadow-sm w-[200px]" value={filterRemitente} onChange={(e) => setFilterRemitente(e.target.value)}>
                                <option value="Todos">-- TODOS --</option>
                                {listRemitentes.map(r => <option key={r} value={r}>{r}</option>)}
                              </select>
                            </div>
                          </div>
                        </th>
                        <th className="p-6 align-top text-center">
                          <div className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Tiempo / Plazo</div>

                            <option value="Todos">TODOS</option>
                            {listTipoPlazos.map(t => <option key={t} value={t}>{t === 'Fijo' ? 'PLAZO FIJO' : 'TRÁMITE REGULAR'}</option>)}
                          </select>
                        </th>
                        <th className="p-6 align-top">
                          <div className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">ESTADO</div>
                          <select className="bg-white border border-slate-200 rounded-lg text-indigo-600 font-bold text-[9px] uppercase p-1.5 cursor-pointer outline-none hover:bg-slate-50 shadow-sm" value={filterEstado} onChange={(e) => setFilterEstado(e.target.value)}>
                            <option value="Todos">TODOS</option>
                            {listEstados.map(e => <option key={e} value={e}>{e}</option>)}
                          </select>
                        </th>
                        <th className="p-6 align-top">
                          <div className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Prioridad</div>

                            <option value="Todos">TODAS</option>
                            {listEtiquetas.map(e => <option key={e} value={e}>{e.toUpperCase()}</option>)}
                          </select>
                        </th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-50">
                      {filteredData.map((row, idx) => {
                        const isAlert = (row.etiqueta || '').toLowerCase().includes('vencido') || (row.etiqueta || '').toLowerCase().includes('riesgo');
                        
                        return (
                          <tr key={row.uid} className="hover:bg-indigo-50/20 transition-all duration-300 group">
                            <td className="p-6 text-center align-top">
                              <span className="text-xs font-black text-slate-400 group-hover:text-indigo-500 transition-colors">{idx + 1}</span>

                              <div className="text-sm font-black text-slate-800 group-hover:text-indigo-600 transition-colors break-words max-w-[150px]">{row.id}</div>

                              <div className="text-[10px] font-black text-slate-500 mt-3 uppercase">{row.tipo}</div>
                              <div className="flex items-center gap-2 mt-1 text-[10px] font-black text-indigo-600 bg-indigo-50 w-fit px-3 py-1 rounded-lg">
                                <i className="fa-solid fa-calendar-days text-[12px]"></i> {row.fecha}
                              </div>
                            </td>
                            <td className="p-6 min-w-[350px] align-top">
                              <div className="text-sm font-extrabold text-slate-700 mb-1">{row.destinatario}</div>
                              <div className="text-[11px] text-slate-600 italic leading-relaxed bg-white/80 p-3 rounded-2xl border border-slate-100 shadow-sm w-full">"{row.asunto}"</div>
                              {row.comentario && row.comentario !== '-' && row.comentario.trim() !== '0' && (
                                  <div className="mt-2 text-[10px] font-bold text-slate-600 bg-amber-50 border border-amber-100 p-2.5 rounded-xl flex items-start gap-2 shadow-sm">
                                    <i className="fa-solid fa-comment-dots text-amber-500 mt-0.5 text-[12px]"></i>
                                    <span>{row.comentario}</span>
                                  </div>
                              )}
                              <div className="mt-3 text-[10px] font-black text-slate-300 uppercase tracking-tighter flex flex-wrap gap-2">
                                <span>EXP: {row.expediente}</span>
                                <span className="text-slate-200">|</span>
                                <span>REM: {row.remitente && row.remitente.includes('-') ? row.remitente.split('-').slice(1).join('-').trim() : row.remitente}</span>
                              </div>
                            </td>
                            
                            <td className="p-6 text-center align-top">
                              {row.tipoLazo === 'Fijo' ? (
                                  <div className="flex flex-col items-center justify-center bg-blue-50/50 p-3 rounded-2xl border border-blue-50 w-full max-w-[140px] mx-auto">
                                      <span className="text-[9px] font-black bg-blue-100 text-blue-700 px-2 py-0.5 rounded uppercase mb-2 whitespace-nowrap shadow-sm">
                                          <i className="fa-regular fa-clock"></i> Plazo Fijo
                                      </span>
                                      <div className={`text-2xl font-black flex items-center justify-center ${isAlert ? 'text-red-600 animate-pulse' : 'text-slate-700'}`}>
                                        {Math.abs(row.diasEntrega)}<span className="text-[10px] ml-0.5 text-slate-400">d</span>
                                        {isAlert && (
                                            <div className="ml-1.5 flex items-center justify-center">
                                               <i className="fa-solid fa-circle-exclamation text-red-500 drop-shadow-sm text-lg"></i>
                                            </div>
                                        )}
                                      </div>
                                      <span className="text-[9px] font-bold text-slate-400 uppercase mt-1 leading-tight">
                                          {row.diasEntrega < 0 ? 'Vencido hace' : 'Días para entrega'}
                                      </span>
                                      {row.plazo && row.plazo !== '-' && (
                                          <div className={`mt-2 text-[9px] font-black px-2 py-1 rounded-lg border w-full text-center ${isAlert ? 'bg-red-50 text-red-600 border-red-100' : 'text-slate-500 bg-white border-slate-100'}`}>
                                              {row.diasEntrega < 0 ? 'VENCIÓ' : 'VENCE'}: {row.plazo}
                                          </div>
                                      )}
                                  </div>
                              ) : (
                                  <div className="flex flex-col items-center justify-center bg-slate-50/50 p-3 rounded-2xl border border-slate-50 w-full max-w-[140px] mx-auto">
                                      <span className="text-[9px] font-black bg-slate-200 text-slate-500 px-2 py-0.5 rounded uppercase mb-2 whitespace-nowrap shadow-sm">
                                          Trámite Regular
                                      </span>
                                      <div className={`text-2xl font-black flex items-center justify-center ${isAlert ? 'text-red-600 animate-pulse' : 'text-slate-700'}`}>
                                        {row.diasTranscurridos}<span className="text-[10px] ml-0.5 text-slate-400">d</span>
                                        {isAlert && (
                                            <div className="ml-1.5 flex items-center justify-center">
                                               <i className="fa-solid fa-circle-exclamation text-red-500 drop-shadow-sm text-lg"></i>
                                            </div>
                                        )}
                                      </div>
                                      <span className="text-[9px] font-bold text-slate-400 uppercase mt-1 leading-tight">Días<br/>Transcurridos</span>
                                  </div>

                            </td>
                            <td className="p-6 align-top">
                              <span className={`text-[10px] font-black px-4 py-2 rounded-xl tracking-tighter shadow-sm whitespace-nowrap block text-center ${

                              }`}>
                                {row.estado}
                              </span>
                            </td>
                            <td className="p-6 align-top">
                              <div className={`px-4 py-2 rounded-2xl text-[10px] font-black uppercase text-center border-2 whitespace-nowrap ${
                                (row.etiqueta || '').toLowerCase().includes('vencido') ? 'bg-red-100 text-red-700 border-red-200 shadow-md shadow-red-200/50' :
                                (row.etiqueta || '').toLowerCase().includes('riesgo') ? 'bg-amber-50 text-amber-600 border-amber-100' :
                                (row.etiqueta || '').toLowerCase().includes('preventiva') ? 'bg-purple-50 text-purple-600 border-purple-100' :
                                (row.etiqueta || '').toLowerCase().includes('plazo') ? 'bg-emerald-50 text-emerald-600 border-emerald-100' :
                                'bg-slate-50 text-slate-400 border-slate-100'
                              }`}>
                                {row.etiqueta}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  
                  {filteredData.length === 0 && (
                    <div className="p-24 text-center">
                      <div className="bg-slate-50 w-28 h-28 rounded-[3rem] flex items-center justify-center mx-auto mb-6 rotate-12 group-hover:rotate-0 transition-transform">
                        <i className="fa-solid fa-magnifying-glass text-[48px] text-slate-200"></i>
                      </div>
                      <p className="text-slate-400 font-black text-xl tracking-tight">Cero coincidencias</p>
                      <p className="text-slate-300 text-sm font-bold">Intenta cambiar los filtros seleccionados.</p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        };

        const StatCard = ({ title, value, percentage, iconClass, color, bg }) => (
          <div className="bg-white p-6 xl:p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/40 border border-white flex items-center justify-between group hover:shadow-2xl hover:-translate-y-2 transition-all duration-500 ease-out">
            <div className="flex flex-col">
              <p className="text-slate-500 text-xs font-black uppercase tracking-[0.15em] mb-2">{title}</p>
              <div className="flex items-end gap-2 xl:gap-3">
                <p className={`text-5xl font-black tracking-tighter leading-none mb-1 ${color}`}>{value}</p>
                {percentage && (
                  <div className={`w-fit px-2 xl:px-2.5 py-1 rounded-xl text-[9px] xl:text-[10px] font-black tracking-wider ${bg} ${color} flex items-center gap-1.5 shadow-sm mb-1.5`}>
                    <i className="fa-solid fa-chart-pie opacity-70 text-[10px]"></i> {percentage}
                  </div>
                )}
              </div>
            </div>
            <div className={`p-4 xl:p-6 rounded-[2rem] ${bg} ${color} group-hover:rotate-12 group-hover:scale-110 transition-all duration-500 shadow-inner flex items-center justify-center w-16 h-16 xl:w-20 xl:h-20 shrink-0`}>
              <i className={`${iconClass} text-3xl xl:text-4xl`}></i>
            </div>
          </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
